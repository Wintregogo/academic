query:
  keywords: ["large language models", "reasoning"]
  categories: ["cs.CL", "cs.AI"]
  time_window_days: 7
  top_k: 5

features:
  author_info:
    enabled: true
    sources: ["openalex"]  # 可选: semantic_scholar, openalex

llm:
  # 支持的提供商: qwen, kimi, deepseek
  provider: "qwen"  # 可选: "qwen", "kimi", "deepseek"
  model: "qwen-plus"  # qwen: "qwen-turbo", "qwen-plus", "qwen-max" | kimi: "moonshot-v1-8k", "moonshot-v1-32k", "moonshot-v1-128k" | deepseek: "deepseek-chat", "deepseek-coder"
  api_key: "sk-232ac2f6dd8e472fa28a3dccde559f49"  # 所有提供商都需要 API Key

parser:
  use_grobid: true
  grobid_url: "http://localhost:8070"

output:
  report_path: "export/report.md"
  csv_path: "export/data.csv"
  json_path: "export/data.json"

